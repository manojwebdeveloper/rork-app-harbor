name: HarborPrivateFamilyLocation
options:
  bundleIdPrefix: com.appamore
  deploymentTarget:
    iOS: "18.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.16.0
settings:
  base:
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: ""
targets:
  HarborPrivateFamilyLocation:
    type: application
    platform: iOS
    sources:
      - path: ios/HarborPrivateFamilyLocation
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseDatabase
      - package: Firebase
        product: FirebaseMessaging
    entitlements:
      path: ios/HarborPrivateFamilyLocation/Resources/HarborPrivateFamilyLocation.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.appamore.harbor
    info:
      path: ios/HarborPrivateFamilyLocation/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: "Harbor:Private Family Location"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.appamore.harbor.invitation
            CFBundleURLSchemes:
              - harbor
        NSLocationWhenInUseUsageDescription: Harbor uses your location only when you choose to share it with a circle.
        NSLocationAlwaysAndWhenInUseUsageDescription: Harbor uses background location to keep an active sharing session updated after you leave the app.
        UIBackgroundModes:
          - location
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appamore.harbor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - HarborPrivateFamilyLocationTests
  HarborPrivateFamilyLocationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/HarborPrivateFamilyLocationTests
    dependencies:
      - target: HarborPrivateFamilyLocation
